# ============================================================
# Docker Compose Profile (Full Stack: Postgres, Redis, Kafka)
# ============================================================

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgres:5432/payflow}
    username: ${DATABASE_USERNAME:payflow_user}
    password: ${DATABASE_PASSWORD:payflow_password}
    driver-class-name: ${DATABASE_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

payflow:
  kafka:
    enabled: true
    listener:
      enabled: true

